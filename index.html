<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarisse Surin — Bâtonnat de Paris 2028</title>
    <meta name="description" content="Maître Clarisse Surin, candidate au Bâtonnat de Paris 2028. Dessinons ENSEMBLE, l'Avocat de demain.">
    <meta name="theme-color" content="#161616">
    <meta property="og:title" content="Clarisse Surin — Bâtonnat de Paris 2028">
    <meta property="og:description" content="Maître Clarisse Surin, candidate au Bâtonnat de Paris 2028. Dessinons ENSEMBLE, l'Avocat de demain.">
    <meta property="og:image" content="https://res.cloudinary.com/dniurvpzd/image/upload/v1775796941/Maitre_clarisse_surin_p0swcq.jpg">
    <meta property="og:url" content="https://batonnat2028.com">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bâtonnat 2028">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root { /* Palette officielle République Française (DSFR — Système de Design de l'État, v1.14) — refonte 2026-05-08. Bleu France #000091, Rouge Marianne #e1000f, grey scale officielle. Source : https://www.systeme-de-design.gouv.fr/. Noms de variables (--or, --navy-*) conservés. */
            --dark: #161616;
            --bg: #FFFFFF;
            --accent: #000091;
            --accent-hover: #1212ff;
            --accent-pale: rgba(0, 0, 145, 0.15);
            --card-bg: #f6f6f6;
            --text-main: #161616;
            --text-muted: #3a3a3a;
            --border: #e5e5e5;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
        }

        /* Accent line accents */
        .line-top, .line-bottom {
            position: fixed;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            opacity: 0.5;
            z-index: 2;
        }
        .line-top { top: 0; }
        .line-bottom { bottom: 0; }

        /* Main container */
        .landing {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 1.2s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Photo */
        .photo-frame {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
            margin-bottom: 2.5rem;
            animation: photoIn 1s ease 0.3s both;
        }

        @keyframes photoIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Name */
        .name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.15;
            margin-bottom: 0.6rem;
            animation: textIn 0.8s ease 0.5s both;
        }

        @keyframes textIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Divider */
        .divider {
            width: 48px;
            height: 2px;
            background: var(--accent);
            margin: 1.2rem auto;
            animation: textIn 0.8s ease 0.65s both;
        }

        /* Title line */
        .title-line {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1rem, 2.8vw, 1.3rem);
            font-weight: 400;
            font-style: italic;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            animation: textIn 0.8s ease 0.8s both;
        }

        /* Subtitle */
        .subtitle {
            font-size: 0.82rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 2rem;
            animation: textIn 0.8s ease 1s both;
        }

        /* CTA link to form */
        .cta-link {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 0.75rem 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #FFFFFF;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            animation: textIn 0.8s ease 1.2s both;
        }

        .cta-link:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 20px rgba(0, 0, 145, 0.3);
            transform: translateY(-1px);
        }

        .cta-link:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (min-width: 520px) {
            .photo-frame {
                width: 220px;
                height: 220px;
            }
        }

        /* Discrete team access link */
        .team-access {
            position: fixed;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            font-size: 0.68rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-decoration: none;
            opacity: 0.55;
            transition: opacity 0.25s ease, color 0.25s ease;
            animation: textIn 0.8s ease 1.6s both;
            white-space: nowrap;
        }

        .team-access:hover {
            opacity: 1;
            color: var(--accent);
        }

        .team-access::before {
            content: '·';
            margin-right: 0.5rem;
            opacity: 0.6;
        }

        .team-access::after {
            content: '·';
            margin-left: 0.5rem;
            opacity: 0.6;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="line-top"></div>
    <div class="line-bottom"></div>

    <main class="landing">
        <div class="photo-frame">
            <img
                src="https://res.cloudinary.com/dniurvpzd/image/upload/v1775796941/Maitre_clarisse_surin_p0swcq.jpg"
                alt="Clarisse Surin"
                width="220"
                height="220"
            >
        </div>

        <h1 class="name">Clarisse Surin</h1>

        <div class="divider"></div>

        <p class="title-line">Candidate au Bâtonnat de Paris 2028</p>

        <p class="subtitle">Site officiel de campagne &mdash; bientot disponible</p>

        <a href="run-for-justice.html" class="cta-link">Rejoindre le mouvement</a>
    </main>

    <a href="campagne.html" class="team-access" title="Découvrir le projet de campagne">Découvrir le projet</a>

    <a href="/mentions.html" style="position:fixed;bottom:1.2rem;right:1.5rem;z-index:4;font-size:0.62rem;font-weight:300;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;opacity:0.45;transition:opacity 0.25s ease,color 0.25s ease;">Mentions légales</a>

</body>
</html>
